name: Import VermoegensNavigator V0.7

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-v07.yml

permissions:
  contents: write

jobs:
  import-live-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: V0.7 vollständig spiegeln und prüfen
        shell: bash
        run: |
          set -euo pipefail

          mirror_dir="$(mktemp -d)"

          wget --recursive --level=1 --page-requisites --convert-links --adjust-extension --no-parent --no-host-directories --directory-prefix="$mirror_dir" --domains=vermoegensnavigator.leonm4.chatgpt.site https://vermoegensnavigator.leonm4.chatgpt.site/

          test -s "$mirror_dir/index.html"
          test -n "$(find "$mirror_dir" -type f -name '*.js' -print -quit)"
          test -n "$(find "$mirror_dir" -type f -name '*.css' -print -quit)"

          python3 - "$mirror_dir" <<'PY'
          import pathlib
          import re
          import sys
          from urllib.parse import unquote, urlsplit

          root = pathlib.Path(sys.argv[1])

          for html_file in root.rglob("*.html"):
              text = html_file.read_text(encoding="utf-8")
              text = re.sub(
                  r'''<script\b[^>]*\bsrc=["']/cdn-cgi/[^"']+["'][^>]*>\s*</script>''',
                  "",
                  text,
                  flags=re.I,
              )
              text = text.replace("/assets/", "./assets/")
              text = text.replace("/favicon.svg", "./favicon.svg")
              html_file.write_text(text, encoding="utf-8")

          for css_file in root.rglob("*.css"):
              text = css_file.read_text(encoding="utf-8")
              text = text.replace("url(/assets/", "url(")
              text = text.replace('url("/assets/', 'url("')
              text = text.replace("url('/assets/", "url('")
              css_file.write_text(text, encoding="utf-8")

          html_files = list(root.rglob("*.html"))
          if not html_files:
              raise SystemExit("Keine HTML-Datei gefunden")

          missing = []
          html_pattern = re.compile(r'''(?:src|href)=["']([^"'#]+)["']''', re.I)
          css_pattern = re.compile(r'''url\(([^)]+)\)''', re.I)

          def local_target(base, value):
              parsed = urlsplit(value)
              if parsed.scheme or value.startswith("//") or value.startswith("data:"):
                  return None
              relative = unquote(parsed.path).strip().strip(chr(34) + chr(39))
              if not relative:
                  return None
              if relative.startswith("/"):
                  return root / relative.lstrip("/")
              return base / relative

          for html_file in html_files:
              text = html_file.read_text(encoding="utf-8")
              for value in html_pattern.findall(text):
                  target = local_target(html_file.parent, value)
                  if target is None:
                      continue
                  if value.endswith("/"):
                      target = target / "index.html"
                  if not target.resolve().exists():
                      missing.append(f"{html_file.relative_to(root)} -> {value}")

          for css_file in root.rglob("*.css"):
              text = css_file.read_text(encoding="utf-8")
              for value in css_pattern.findall(text):
                  target = local_target(css_file.parent, value)
                  if target is not None and not target.resolve().exists():
                      missing.append(f"{css_file.relative_to(root)} -> {value}")

          if missing:
              raise SystemExit("Fehlende Referenzen:\n" + "\n".join(missing))
          PY

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$mirror_dir"/. .
          touch .nojekyll

          test -s index.html
          test -n "$(find . -type f -name '*.js' -print -quit)"
          test -n "$(find . -type f -name '*.css' -print -quit)"

          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/vermoegensnavigator-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/tmp/vermoegensnavigator-index.html; then
              break
            fi
            sleep 1
          done

          test -s /tmp/vermoegensnavigator-index.html

      - name: Übernommenen Stand veröffentlichen
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy VermoegensNavigator V0.7"
          git push
