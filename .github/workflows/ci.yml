name: Feature CI

on:
  push:
    branches:
      - "work/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, Typecheck, Build und Browser
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Playwright Chromium vorbereiten
        run: npx playwright install --with-deps chromium

      - name: Vollständiges Gate (Fachtests, Typecheck, Build und Browser)
        run: npm run verify

      - name: R1 artifact and operational regressions
        run: |
          node scripts/verify-release-artifact.mjs "$GITHUB_SHA"
          node --test scripts/verify-r1.test.mjs

      - name: Diff auf Whitespace-Fehler prüfen
        shell: bash
        run: |
          git fetch origin main --no-tags
          git diff --check origin/main...HEAD

      - name: Synthetische Browserdiagnose bei Fehlern sichern
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cp0b-browser-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 5
