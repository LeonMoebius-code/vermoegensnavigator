name: Feature CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: feature-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Vollständige PR-Prüfung
    runs-on: ubuntu-latest
    outputs:
      receipt: ${{ steps.complete.outputs.receipt }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout-Identität verpflichtend prüfen
        id: identity
        run: node scripts/verify-ci-checkout-identity.mjs

      - name: Checkout-Identitätsnachweis bereitstellen
        id: evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-checkout-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-checkout-identity/identity.json
          if-no-files-found: error
          retention-days: 30

      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Checkout-Identitätscheck Regressionen
        id: ci_regressions
        run: node --test scripts/verify-ci-checkout-identity.test.mjs scripts/verify-ci-integration.test.mjs

      - name: Abhängigkeiten installieren
        id: dependencies
        run: npm ci

      - name: Playwright Chromium vorbereiten
        id: chromium
        run: npx playwright install --with-deps chromium

      - name: Vollständiges Gate (Fachtests, Typecheck, Build und Browser)
        id: full_verify
        run: npm run verify

      - name: R1 artifact and operational regressions
        id: r1
        run: |
          node scripts/verify-release-artifact.mjs "$GITHUB_SHA"
          node --test scripts/verify-r1.test.mjs

      - name: Diff auf Whitespace-Fehler prüfen
        id: diff
        shell: bash
        run: |
          git fetch origin main --no-tags
          git diff --check origin/main...HEAD

      - name: Vollständigkeit und aktuelle Integrationsidentität bestätigen
        id: complete
        env:
          CI_STEP_RESULTS: ${{ toJSON(steps) }}
        run: node scripts/verify-ci-integration.mjs complete

      - name: Synthetische Browserdiagnose bei Fehlern sichern
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cp0b-browser-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 5

  integration:
    # Keep the existing required status context. Never emit it from push CI.
    name: Tests, Typecheck, Build und Browser
    if: ${{ always() }}
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Nur erfolgreich vollständig geprüften PR-Stand freigeben
        env:
          CI_VERIFY_RESULT: ${{ needs.verify.result }}
          CI_VERIFY_RECEIPT: ${{ needs.verify.outputs.receipt }}
        run: node scripts/verify-ci-integration.mjs gate
