name: Feature CI

on:
  push:
    branches:
      - "work/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, Typecheck, Build und Browser
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Playwright Chromium vorbereiten
        run: npx playwright install --with-deps chromium

      - name: Vollständiges Gate (Fachtests, Typecheck, Build und Browser)
        run: npm run verify

      - name: Diff auf Whitespace-Fehler prüfen
        shell: bash
        run: |
          git fetch origin main --no-tags
          git diff --check origin/main...HEAD

      - name: Synthetische Browserdiagnose bei Fehlern sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cp0b-browser-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 5
