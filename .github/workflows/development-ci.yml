name: Development CI

on:
  push:
    branches:
      - "work/**"

permissions:
  contents: read

concurrency:
  group: development-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Schnelle Entwicklungsprüfung
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout-Identität verpflichtend prüfen
        run: node scripts/verify-ci-checkout-identity.mjs
      - name: Checkout-Identitätsnachweis bereitstellen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-checkout-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-checkout-identity/identity.json
          if-no-files-found: error
          retention-days: 30
      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: CI-Sicherheitsregressionen
        run: node --test scripts/verify-ci-checkout-identity.test.mjs scripts/verify-ci-integration.test.mjs
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Sicherheitsregressionen, fachlicher Kern und Typecheck
        run: npm run verify:development
      - name: Diff auf Whitespace-Fehler prüfen
        shell: bash
        run: |
          git fetch origin main --no-tags
          git diff --check origin/main...HEAD
